<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Emotion Recognition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- WaveSurfer.js CDN -->
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #2563eb;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .dark-bg { background: transparent; }
        .dark-input { background: transparent; }
        .dark-border { border-color: transparent; }
    </style>
</head>

<body class="bg-gradient-to-br from-[#0f172a] via-[#1e293b] to-[#0f172a] min-h-screen flex items-center justify-center p-4 text-gray-100 font-sans selection:bg-cyan-500/30">

    <!-- Ambient background glows -->
    <div class="fixed top-0 left-1/4 w-96 h-96 bg-blue-600/20 rounded-full mix-blend-screen filter blur-3xl opacity-50 animate-blob pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-cyan-600/20 rounded-full mix-blend-screen filter blur-3xl opacity-50 animate-blob animation-delay-2000 pointer-events-none"></div>

    <div class="relative bg-white/5 backdrop-blur-2xl border border-white/10 w-full max-w-2xl shadow-[0_8px_32px_0_rgba(0,0,0,0.36)] rounded-3xl p-10 transition-all z-10">

        <h1 class="text-4xl md:text-5xl font-extrabold text-center bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-cyan-300 to-blue-500 drop-shadow-sm tracking-tight mb-3">Speech Emotion Recognition</h1>
        <p class="text-center text-blue-200/70 font-medium mt-2 mb-10 text-lg">
            Upload or record audio to detect emotion.
        </p>

        <div class="mb-6">
            <label for="audio-upload" class="block text-lg font-semibold text-gray-300 mb-3">
                1. Input Audio
            </label>
            <div class="flex flex-col md:flex-row gap-5">
                <!-- File Upload -->
                <label for="audio-upload"
                    class="group flex-1 flex flex-col items-center justify-center h-36 px-4 py-6 bg-white/5 rounded-2xl border-2 border-white/10 border-dashed cursor-pointer hover:bg-white/10 hover:border-cyan-400/50 transition-all duration-300 shadow-inner">
                    <div class="flex flex-col items-center justify-center">
                        <svg class="w-12 h-12 text-blue-400/70 group-hover:scale-110 group-hover:text-cyan-400 transition-all duration-300" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M12 15l-3-3m0 0l3-3m-3 3h12">
                            </path>
                        </svg>
                        <p class="mt-3 text-sm text-gray-300">
                            <span class="font-semibold text-cyan-200">Click to upload</span> or drag & drop
                        </p>
                        <p class="text-xs text-gray-500">WAV, MP3, or M4A</p>
                    </div>
                    <input id="audio-upload" type="file" class="hidden" accept="audio/*">
                </label>
                <!-- Microphone Recorder -->
                <button id="record-btn"
                    class="group flex-1 bg-gradient-to-br from-blue-600/80 to-blue-800/80 text-white font-semibold py-3 rounded-2xl border border-white/10 shadow-[0_4px_20px_rgba(37,99,235,0.2)] hover:shadow-[0_8px_30px_rgba(37,99,235,0.4)] hover:-translate-y-1 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none flex flex-col items-center justify-center gap-2">
                    <svg id="mic-icon" class="w-10 h-10 text-white/90 group-hover:scale-110 transition-transform duration-300" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 18v2m0 0h3m-3 0a7 7 0 01-7-7V10a5 5 0 0110 0v3a7 7 0 01-7 7z" />
                        <circle cx="12" cy="11" r="4" stroke="currentColor" stroke-width="2" fill="none"/>
                    </svg>
                    <span id="record-label" class="text-sm tracking-wide">Record Audio</span>
                    <span id="record-timer" class="text-xs text-gray-400"></span>
                </button>
            </div>
            <p id="file-name" class="text-center text-sm text-gray-400 mt-3 h-5"></p>
        </div>

        <!-- Waveform Display & Playback -->
        <div id="waveform-container" class="w-full my-6 hidden">
            <div id="waveform" class="bg-[#22304c] rounded-lg mb-2" style="height:70px;"></div>
            <div class="flex items-center gap-4">
                <button id="play-btn" class="bg-blue-700 text-white px-4 py-2 rounded-lg focus:outline-none">Play/Pause</button>
                <span id="audio-duration" class="text-gray-400 text-sm"></span>
            </div>
        </div>

        <div class="mb-8">
            <button id="analyze-btn"
                class="relative w-full overflow-hidden bg-gradient-to-r from-cyan-500 to-blue-600 text-white text-xl font-bold py-4 px-6 rounded-2xl shadow-[0_0_20px_rgba(6,182,212,0.3)] hover:shadow-[0_0_30px_rgba(6,182,212,0.5)] focus:outline-none focus:ring-4 focus:ring-cyan-500/50 transition-all duration-300 transform hover:-translate-y-1 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
                <span class="relative z-10 tracking-wide">2. Analyze Emotion</span>
            </button>
        </div>

        <div>
            <h2 class="text-xl font-semibold text-gray-200 mb-4 tracking-tight">
                3. Analysis & Results
            </h2>
            <div id="status-area" class="bg-black/20 backdrop-blur-md border border-white/10 text-white rounded-3xl p-8 min-h-[280px] flex flex-col justify-center items-center overflow-hidden shadow-inner relative">
                <div id="initial-state" class="flex flex-col items-center justify-center h-full text-blue-200/60">
                    <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M9 19V6l11 0"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M11 19V6l11 0"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M5 19V6l11 0"></path>
                    </svg>
                    <p class="font-medium text-lg tracking-wide">Waiting for audio input...</p>
                    <p class="text-sm mt-1">Upload or record, then analyze.</p>
                </div>
                <div id="processing-state" class="hidden">
                    <div class="flex items-center mb-4">
                        <div class="spinner mr-4"></div>
                        <span id="processing-title" class="text-xl font-medium text-blue-200">Analyzing...</span>
                    </div>
                    <ul id="processing-steps" class="space-y-2 font-mono text-sm text-gray-300"></ul>
                </div>
                <div id="result-state" class="hidden w-full h-full flex flex-col items-center justify-center animate-fade-in">
                    <div class="text-center">
                        <p class="text-cyan-300/80 font-semibold tracking-widest uppercase text-sm mb-4">Analysis Complete</p>
                        <div id="result-emoji" class="text-9xl mb-6 filter drop-shadow-[0_10px_20px_rgba(0,0,0,0.5)] transform hover:scale-110 transition-transform duration-500"></div>
                        <h3 class="text-5xl font-black bg-clip-text text-transparent bg-gradient-to-r from-emerald-300 to-cyan-400 drop-shadow-md tracking-tight capitalize" id="result-text"></h3>
                        <div class="mt-6 inline-block bg-white/10 px-4 py-2 rounded-full border border-white/10 backdrop-blur-sm">
                            <p class="text-lg font-medium text-blue-100" id="result-confidence"></p>
                        </div>
                        <p class="text-md text-blue-200 mt-4 italic" id="result-transcript"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="message-box"
        class="hidden fixed top-5 right-5 bg-red-600 text-white py-3 px-5 rounded-lg shadow-lg">
        <span id="message-text"></span>
    </div>

    <script>
        const audioUpload = document.getElementById('audio-upload');
        const fileNameDisplay = document.getElementById('file-name');
        const analyzeBtn = document.getElementById('analyze-btn');
        const statusArea = document.getElementById('status-area');
        const initialState = document.getElementById('initial-state');
        const processingState = document.getElementById('processing-state');
        const processingTitle = document.getElementById('processing-title');
        const processingSteps = document.getElementById('processing-steps');
        const resultState = document.getElementById('result-state');
        const resultEmoji = document.getElementById('result-emoji');
        const resultText = document.getElementById('result-text');
        const resultConfidence = document.getElementById('result-confidence');
        const messageBox = document.getElementById('message-box');
        const messageText = document.getElementById('message-text');
        const recordBtn = document.getElementById('record-btn');
        const recordLabel = document.getElementById('record-label');
        const recordTimer = document.getElementById('record-timer');
        const micIcon = document.getElementById('mic-icon');

        // Waveform
        let wavesurfer = null;
        const waveformContainer = document.getElementById('waveform-container');
        const playBtn = document.getElementById('play-btn');
        const audioDuration = document.getElementById('audio-duration');

        const API_URL = "/predict";
        const EMOTION_EMOJIS = {"Happy":"😀","Sad":"😢","Angry":"😡","Neutral":"😐","Fear":"😨","Disgust":"🤢","Surprise":"😮", "Excited":"🤩"};

        let recordedBlob = null;
        let isRecording = false;
        let mediaRecorder = null;
        let chunks = [];
        let recordStartTime = 0;
        let recordTimerInterval = null;

        function msToTime(ms) {
            const sec = Math.floor(ms / 1000) % 60;
            const min = Math.floor(ms / 60000);
            return `${min}:${sec.toString().padStart(2, '0')}`;
        }
        function showMessage(message) {
            messageText.textContent = message;
            messageBox.classList.remove('hidden');
            setTimeout(() => { messageBox.classList.add('hidden'); }, 3000);
        }
        function resetStatus() {
            initialState.style.display = 'flex'; processingState.style.display = 'none';
            resultState.style.display = 'none'; processingSteps.innerHTML = '';
            analyzeBtn.disabled = false; analyzeBtn.textContent = "2. Analyze Emotion";
        }
        audioUpload.addEventListener('change', () => {
            resetStatus();
            waveformContainer.classList.add('hidden');
            if (audioUpload.files.length > 0) {
                fileNameDisplay.textContent = audioUpload.files[0].name;
                recordedBlob = null;
                showWaveform(audioUpload.files[0]);
            }
        });
        analyzeBtn.addEventListener('click', () => {
            if (audioUpload.files.length === 0 && !recordedBlob) {
                showMessage("Please upload or record an audio file first.");
                return;
            }
            analyzeBtn.disabled = true;
            analyzeBtn.textContent = "Analyzing...";
            if (audioUpload.files.length > 0) {
                processAudioFile(audioUpload.files[0]);
            } else if (recordedBlob) {
                processAudioFile(recordedBlob, "recorded_audio.wav");
            }
        });

        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showMessage("Microphone not supported.");
                    return;
                }
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    chunks = [];
                    isRecording = true;
                    recordedBlob = null;
                    recordTimerInterval && clearInterval(recordTimerInterval);
                    recordStartTime = Date.now();
                    recordLabel.textContent = "Stop Recording";
                    micIcon.classList.add('text-red-400');
                    recordTimerInterval = setInterval(() => {
                        const elapsed = Date.now() - recordStartTime;
                        recordTimer.textContent = msToTime(elapsed);
                    }, 200);
                    resetStatus();
                    fileNameDisplay.textContent = "Recording...";
                    mediaRecorder.start();
                    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        isRecording = false;
                        // Use the correct MIME type based on what the browser actually recorded
                        const mimeType = mediaRecorder.mimeType || 'audio/webm';
                        recordedBlob = new Blob(chunks, { type: mimeType });
                        fileNameDisplay.textContent = "Recorded audio ready";
                        recordLabel.textContent = "Record Audio";
                        micIcon.classList.remove('text-red-400');
                        clearInterval(recordTimerInterval);
                        recordTimer.textContent = '';
                        // Show waveform for recorded audio
                        handleRecordingComplete(recordedBlob);
                    };
                } catch (err) {
                    showMessage("Microphone access denied.");
                }
            } else {
                // Stop recording
                isRecording = false;
                recordLabel.textContent = "Record Audio";
                micIcon.classList.remove('text-red-400');
                recordTimerInterval && clearInterval(recordTimerInterval);
                recordTimer.textContent = '';
                mediaRecorder && mediaRecorder.stop();
            }
        });

        function handleRecordingComplete(blob) {
            waveformContainer.classList.add('hidden');
            if (blob) {
                showWaveform(blob);
            }
        }

        // --- WAVESURFER HANDLING ---
        function showWaveform(blobOrFile) {
            waveformContainer.classList.remove('hidden');

            // Clean up previous instance if any
            if (wavesurfer) {
                wavesurfer.destroy();
                wavesurfer = null;
            }

            wavesurfer = WaveSurfer.create({
                container: '#waveform',
                waveColor: '#38bdf8',
                progressColor: '#2563eb',
                height: 70,
                barWidth: 2,
                cursorColor: '#fff',
                backgroundColor: '#22304c'
            });

            const fileURL = URL.createObjectURL(blobOrFile);
            wavesurfer.load(fileURL);

            wavesurfer.on('ready', () => {
                let dur = wavesurfer.getDuration();
                audioDuration.textContent = "Duration: " + dur.toFixed(2) + "s";
            });

            playBtn.onclick = () => {
                if (wavesurfer) {
                    wavesurfer.playPause();
                }
            };
        }

        async function processAudioFile(fileOrBlob, filename) {
            initialState.style.display = 'none';
            resultState.style.display = 'none';
            processingState.style.display = 'block';
            processingTitle.textContent = 'Connecting to Python...';
            processingSteps.innerHTML = '';
            const formData = new FormData();
            if (fileOrBlob instanceof Blob && filename)
                formData.append('audio_file', fileOrBlob, filename);
            else
                formData.append('audio_file', fileOrBlob);

            processingSteps.innerHTML += '<li>[1/4] Uploading audio to server...</li>';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });
                processingTitle.textContent = 'Analyzing...';
                if (!response.ok) {
                    let errorData = null;
                    try { errorData = await response.json(); } catch (e) {}
                    throw new Error(errorData?.error || `Server error: ${response.status}`);
                }
                const data = await response.json();
                processingSteps.innerHTML += '<li class="text-green-400">[✓] Step 2: Server extracted features (MFCCs, etc.)</li>';
                processingSteps.innerHTML += '<li class="text-green-400">[✓] Step 3: Server ran RNN model</li>';
                processingSteps.innerHTML += '<li class="text-green-400">[✓] Step 4: Receiving prediction...</li>';
                await new Promise(resolve => setTimeout(resolve, 1000));
                processingState.style.display = 'none';
                resultState.style.display = 'block';
                const emotion = data.emotion;
                const confidence = (data.confidence * 100).toFixed(1);
                const transcript = data.transcript;
                resultEmoji.textContent = EMOTION_EMOJIS[emotion] || '🤔';
                resultText.textContent = emotion;
                resultConfidence.textContent = `(Confidence: ${confidence}%)`;
                
                const resultTranscript = document.getElementById('result-transcript');
                if (transcript) {
                    resultTranscript.textContent = `You said: "${transcript}"`;
                } else {
                    resultTranscript.textContent = '';
                }

                // Play a short beep to indicate completion (speaker)
                const feedbackAudio = document.getElementById('feedback-audio');
                if (feedbackAudio) feedbackAudio.play();
            } catch (error) {
                console.error("Analysis failed:", error);
                if (error.message.includes('Failed to fetch')) {
                    showMessage("Error: Could not connect to Python backend.");
                    processingSteps.innerHTML += '<li class="text-red-400">[X] Failed to connect to Python backend.</li>';
                    processingSteps.innerHTML += '<li class="text-yellow-300">Is the `app.py` server running?</li>';
                } else {
                    showMessage(`Error: ${error.message}`);
                }
                analyzeBtn.disabled = false;
                analyzeBtn.textContent = "2. Analyze Emotion";
                processingTitle.textContent = 'Error';
            }
        }
        // Dark mode on initial load
        document.body.classList.add('dark-bg');
    </script>
    <audio id="feedback-audio" src="data:audio/wav;base64,//uQxAAABhAAAAABAAEAgD///8AAACdAQAAAAAAACcAAAABAAAAAQAAQAAAAAAAABJZGF0YQAAAAA=" preload="auto"></audio>
</body>
</html>
